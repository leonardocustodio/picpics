name: picpics
description: picPics Application
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  auto_size_text: ^3.0.0
  background_fetch: ^1.4.0
  carousel_slider: ^5.1.1
  cloud_functions: ^6.0.0
  convert: ^3.1.2
  cryptography: ^2.7.0
  cupertino_icons: ^1.0.8
  #date_utils: ^0.2.0
  devicelocale: ^0.8.1
  diacritic: ^0.1.6
  drift: ^2.28.1
  email_validator: ^3.0.0
  encrypt: ^5.0.3
  expandable: ^5.0.1
  extended_image: ^10.0.1
#  facebook_app_events: ^0.19.0
  firebase_analytics: ^12.0.0
  firebase_auth: ^6.0.1
  firebase_core: ^4.0.0
  firebase_crashlytics: ^5.0.0
  firebase_messaging: ^16.0.0
  firebase_remote_config: ^6.0.0
  flutter_animator: ^3.2.2
  flutter_blurhash: ^0.9.1
  flutter_keyboard_visibility: ^6.0.0
  flutter_local_notifications: ^19.4.0
  flutter_localization: ^0.3.3
  flutter_riverpod: ^3.0.0-dev.17
  flutter_secure_storage: ^10.0.0
  flutter_spinkit: ^5.2.2
  flutter_staggered_grid_view:
    git:
      url: https://github.com/suyulin/flutter_staggered_grid_view
  flutter_swiper_view: ^1.1.8
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.12.3
  googleapis: ^15.0.0
  googleapis_auth: ^2.0.0
  home_widget: ^0.9.0
  http: ^1.2.2
  image: ^4.5.4
  intl: ^0.20.2
  local_auth: ^3.0.0
  logger: ^2.5.0
  mime: ^2.0.0
  package_info_plus: ^9.0.0
  path: ^1.8.3
  path_provider: ^2.1.5
  percent_indicator: ^4.2.5
  photo_manager: ^3.7.1
  photo_view: ^0.15.0
  rate_my_app: ^2.3.2
  riverpod_annotation: ^4.0.0
  share_plus: ^12.0.1
  simple_animations: ^5.2.0
  sqlite3_flutter_libs: ^0.5.39
  strings: ^4.0.1
  supercharged: ^2.1.1
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.0
  drift_dev: ^2.28.1
  flutter_lints: ^6.0.0
  riverpod: ^3.0.0-dev.17
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.0.0-dev.17

flutter:
  uses-material-design: true
  assets:
    - lib/images/
    - lib/anims/
  fonts:
    - family: Lato
      fonts:
        - asset: lib/fonts/Lato-Bold.ttf
          weight: 700
        - asset: lib/fonts/Lato-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: lib/fonts/Lato-Black.ttf
          weight: 900
        - asset: lib/fonts/Lato-BlackItalic.ttf
          style: italic
          weight: 900
        - asset: lib/fonts/Lato-Light.ttf
          weight: 300
        - asset: lib/fonts/Lato-LightItalic.ttf
          weight: 300
          style: italic
        - asset: lib/fonts/Lato-Thin.ttf
          weight: 100
        - asset: lib/fonts/Lato-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: lib/fonts/Lato-Regular.ttf
          weight: 400
        - asset: lib/fonts/Lato-Italic.ttf
          weight: 400
          style: italic
    - family: NotoSans
      fonts:
        - asset: lib/fonts/NotoSans-Light.ttf
          weight: 300
        - asset: lib/fonts/NotoSans-Regular.ttf
          weight: 400